name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend-static-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps and static analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Dependency audit backend
        run: |
          python -m pip_audit -r backend/requirements.txt --ignore-vuln CVE-2024-23342

      - name: Flake8 backend safety-critical modules
        run: |
          python -m flake8 \
            backend/app/services/governance.py \
            backend/app/api/v1/endpoints/faculties.py \
            backend/app/api/v1/endpoints/departments.py \
            backend/app/api/v1/endpoints/programs.py \
            backend/app/api/v1/endpoints/specializations.py \
            backend/app/api/v1/endpoints/batches.py \
            backend/app/api/v1/endpoints/semesters.py \
            backend/app/api/v1/endpoints/classes.py \
            scripts/check_backend_safety.py

      - name: Mypy backend governance and academic setup safety-critical modules
        run: |
          python -m mypy --config-file mypy.ini \
            backend/app/services/governance.py \
            backend/app/api/v1/endpoints/faculties.py \
            backend/app/api/v1/endpoints/departments.py \
            backend/app/api/v1/endpoints/programs.py \
            backend/app/api/v1/endpoints/specializations.py \
            backend/app/api/v1/endpoints/batches.py \
            backend/app/api/v1/endpoints/semesters.py \
            backend/app/api/v1/endpoints/classes.py \
            scripts/check_backend_safety.py

      - name: Bandit backend
        run: |
          python -m bandit \
            -c bandit.yaml \
            backend/app/services/governance.py \
            backend/app/api/v1/endpoints/faculties.py \
            backend/app/api/v1/endpoints/departments.py \
            backend/app/api/v1/endpoints/programs.py \
            backend/app/api/v1/endpoints/specializations.py \
            backend/app/api/v1/endpoints/batches.py \
            backend/app/api/v1/endpoints/semesters.py \
            backend/app/api/v1/endpoints/classes.py \
            scripts/check_backend_safety.py

      - name: Custom backend safety checks
        run: |
          python scripts/check_backend_safety.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run backend tests with coverage gate
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=55

  backend-perf-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run backend performance smoke gate
        run: |
          python scripts/perf_smoke.py

  release-governance-gate:
    runs-on: ubuntu-latest
    needs: [backend, backend-perf-smoke]
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run release governance gate
        run: |
          python scripts/release_gate.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Dependency audit frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test:ci

      - name: Run frontend coverage gate
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

  academic-hierarchy-merge-gate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URL: mongodb://127.0.0.1:27017
      MONGODB_DB: caps_ai_ci
      JWT_SECRET: ci-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Run master hierarchy regression tests
        run: |
          python -m pytest \
            backend/tests/test_master_hierarchy_import.py \
            backend/tests/test_master_hierarchy_hardening.py \
            backend/tests/test_academic_setup_rules.py

      - name: Compile backend sources
        run: python -m compileall backend/app backend/scripts

      - name: Seed ephemeral master hierarchy
        run: python backend/scripts/import_master_hierarchy.py --no-summary

      - name: Verify dry-run stability
        run: python backend/scripts/import_master_hierarchy.py --dry-run --no-summary --fail-on-change-plan

      - name: Run academic integrity audit gate
        run: python backend/scripts/audit_academic_integrity.py --fail-on-findings

      - name: Lint frontend
        run: npm --prefix frontend run lint
